<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    :root {
      --bg: #f5f7f9;
      --card: #ffffff;
      --border: #e3e7eb;
      --text: #2c3e50;
      --text-soft: #6b7280;
      --green: #16B378;
      --blue: #4f7cff;
      --orange: #e59b32;
      --red: #dc6464;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .dashboard {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .dashboard-title {
      margin-bottom: 16px;
    }

    .dashboard-title h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .dashboard-title p {
      margin: 4px 0 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    /* Contenedor de cada período */
    .period-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* Header del período */
    .period-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #fafbfc;
    }

    .period-title {
      font-size: 15px;
      font-weight: 700;
    }

    /* Métricas */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
    }

    .metric {
      padding: 18px 16px;
      border-right: 1px solid var(--border);
      min-width: 0;
    }

    .metric:last-child {
      border-right: none;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-soft);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    .metric.usd .metric-value {
      color: var(--green);
    }

    .metric.pesos .metric-value {
      color: var(--blue);
    }

    .metric.dictadas .metric-value {
      color: var(--green);
    }

    .metric.canceladas .metric-value {
      color: var(--orange);
    }

    .metric.externas .metric-value {
      color: var(--red);
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      background: white;
      border-radius: 12px;
      color: var(--text-soft);
    }

    @media (max-width: 1100px) {
      .metrics-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .metric:nth-child(3) {
        border-right: none;
      }

      .metric:nth-child(-n+3) {
        border-bottom: 1px solid var(--border);
      }
    }

    @media (max-width: 650px) {
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .metric {
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      .metric:nth-child(2n) {
        border-right: none;
      }

      .metric:nth-last-child(-n+2) {
        border-bottom: none;
      }
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <div id="period-container">
      <div class="empty-state">
        Cargando información...
      </div>
    </div>

  </div>

  <script src="resumen_liq.js"></script>

</body>
</html>
